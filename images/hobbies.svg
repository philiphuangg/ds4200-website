<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Illustration of a tennis ball, a soccer ball, and a cooking pan">
  <rect width="600" height="260" fill="#eef4f3"/>
  <!-- tennis ball -->
  <circle cx="110" cy="130" r="70" fill="#d9e84a"/>
  <path d="M55 85 C95 120 95 140 55 175" fill="none" stroke="#fff" stroke-width="6"/>
  <path d="M165 85 C125 120 125 140 165 175" fill="none" stroke="#fff" stroke-width="6"/>
  <!-- soccer ball -->
  <circle cx="300" cy="130" r="70" fill="#fff" stroke="#264653" stroke-width="5"/>
  <polygon points="300,100 326,119 316,150 284,150 274,119" fill="#264653"/>
  <g stroke="#264653" stroke-width="4">
    <line x1="300" y1="100" x2="300" y2="62"/><line x1="326" y1="119" x2="360" y2="105"/>
    <line x1="316" y1="150" x2="340" y2="182"/><line x1="284" y1="150" x2="260" y2="182"/>
    <line x1="274" y1="119" x2="240" y2="105"/>
  </g>
  <!-- frying pan -->
  <circle cx="480" cy="135" r="55" fill="#264653"/>
  <circle cx="480" cy="135" r="42" fill="#3b6070"/>
  <rect x="530" y="127" width="60" height="16" rx="8" fill="#264653"/>
  <circle cx="470" cy="130" r="14" fill="#e9c46a"/><circle cx="470" cy="130" r="7" fill="#f4a261"/>
</svg>
