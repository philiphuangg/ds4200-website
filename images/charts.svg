<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Illustration of a line chart and scatter points">
  <rect width="600" height="300" fill="#eef4f3"/>
  <polyline points="40,240 140,180 240,200 340,110 440,130 560,50" fill="none" stroke="#2a9d8f" stroke-width="5"/>
  <g fill="#e76f51">
    <circle cx="40" cy="240" r="8"/><circle cx="140" cy="180" r="8"/><circle cx="240" cy="200" r="8"/>
    <circle cx="340" cy="110" r="8"/><circle cx="440" cy="130" r="8"/><circle cx="560" cy="50" r="8"/>
  </g>
  <line x1="30" y1="265" x2="580" y2="265" stroke="#264653" stroke-width="3"/>
  <line x1="30" y1="20" x2="30" y2="265" stroke="#264653" stroke-width="3"/>
</svg>
